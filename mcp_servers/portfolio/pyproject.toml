[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-mcp-server"
version = "1.0.0"
description = "Official Portfolio MCP Server for Freelancer Evidence Retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GigBid Team" }]
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0.0"
]

[project.scripts]
portfolio-mcp = "mcp_servers.portfolio.server:server.run"
